version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: loadboard-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: loadboard
      POSTGRES_USER: loadboard_user
      POSTGRES_PASSWORD: loadboard_pass

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
