# Test profile properties - use in-memory H2 so tests run without a Postgres instance
spring.datasource.url=jdbc:h2:mem:testdb-${random.uuid};DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.sql.init.mode=never

# FMCSA client test placeholders
fmcsa.base-url=http://localhost
fmcsa.api-key=test-api-key

# JWT test placeholders (must be >= 256 bits for jjwt HMAC)
jwt.secret=01234567890123456789012345678901
jwt.expiration-ms=3600000

# Mail stub for tests
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
