# ── Database (H2 in-memory, no Postgres needed) ───────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.sql.init.mode=never

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=01234567890123456789012345678901
jwt.expiration-ms=3600000

# ── Mail (stub — no real SMTP) ────────────────────────────────────────────────
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ── App properties ────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173
app.cookie.secure=false
app.cookie.same-site=Lax
app.frontend.base-url=http://localhost:5173
app.mail.from=no-reply@haulius.com
app.mail.from-name=Haulius

# ── FMCSA (stub) ──────────────────────────────────────────────────────────────
fmcsa.base-url=http://localhost
fmcsa.api-key=test-api-key

# ── AI / Anthropic (stub — empty key disables AI features) ───────────────────
anthropic.api-key=
anthropic.model=claude-sonnet-4-6

# ── Metrics (disable all exporters so no API keys are needed) ─────────────────
management.datadog.metrics.export.enabled=false
management.defaults.metrics.export.enabled=false
