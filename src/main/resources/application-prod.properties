# Production overrides — activate with: --spring.profiles.active=prod

# Schema managed by migrations only; no auto-DDL changes in prod
spring.jpa.hibernate.ddl-auto=validate

# Disable SQL query logging
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Docker Compose integration not used in prod
spring.docker.compose.enabled=false

# Cookie must be Secure+SameSite=None over HTTPS in prod
app.cookie.secure=true
app.cookie.same-site=None

# Structured JSON logging — includes MDC fields (requestId) automatically
logging.structured.format.console=logstash
