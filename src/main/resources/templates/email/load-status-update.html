<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="'Load Update: ' + ${statusLabel}">Load Update</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f4f4f5; margin: 0; padding: 0; }
        .wrapper { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .header { background: #f59e0b; padding: 32px 40px; text-align: center; }
        .header h1 { color: #fff; margin: 0; font-size: 22px; letter-spacing: .5px; }
        .header .status-label { color: #fff8e1; font-size: 13px; margin-top: 6px; letter-spacing: 1px; text-transform: uppercase; }
        .body { padding: 36px 40px; color: #374151; }
        .body p { line-height: 1.65; margin: 0 0 16px; }
        .status-badge { display: inline-block; padding: 6px 18px; border-radius: 20px; font-size: 13px; font-weight: 700; letter-spacing: .5px; margin-bottom: 20px; }
        .badge-picked_up  { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
        .badge-delivered  { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
        .badge-paid       { background: #ede9fe; color: #4c1d95; border: 1px solid #c4b5fd; }
        .detail-box { background: #fffbeb; border-left: 4px solid #f59e0b; padding: 16px 20px; border-radius: 4px; margin: 20px 0; }
        .detail-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #fde68a; font-size: 14px; }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: #6b7280; font-weight: 500; }
        .detail-value { color: #111827; font-weight: 600; }
        .footer { padding: 20px 40px; background: #f9fafb; text-align: center; font-size: 12px; color: #9ca3af; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="header">
        <h1>🚚 Load Status Update</h1>
        <div class="status-label" th:text="${statusLabel}">Status</div>
    </div>
    <div class="body">
        <p>Hi <strong th:text="${brokerName}">Broker</strong>,</p>

        <span class="status-badge"
              th:classappend="${newStatus == 'PICKED_UP'} ? 'badge-picked_up' : (${newStatus == 'DELIVERED'} ? 'badge-delivered' : 'badge-paid')"
              th:text="${statusLabel}">Status</span>

        <p th:text="${statusDescription}">Status description.</p>

        <div class="detail-box">
            <div class="detail-row">
                <span class="detail-label">Vehicle</span>
                <span class="detail-value" th:text="${vehicleSummary}">Vehicle</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Route</span>
                <span class="detail-value">
                    <span th:text="${pickupCity}">City</span>,&nbsp;<span th:text="${pickupState}">ST</span>
                    &nbsp;→&nbsp;
                    <span th:text="${dropCity}">City</span>,&nbsp;<span th:text="${dropState}">ST</span>
                </span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Carrier</span>
                <span class="detail-value" th:text="${carrierName}">Carrier</span>
            </div>
        </div>

        <p style="font-size:13px; color:#6b7280;">
            You can log into your dashboard to view the full load details and history.
        </p>
    </div>
    <div class="footer">
        &copy; 2026 LoadBoard. All rights reserved.
    </div>
</div>
</body>
</html>
