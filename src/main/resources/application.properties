spring.application.name=loadboard-backend

server.port=8080

spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.mapper.accept-case-insensitive-properties=true

spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

spring.docker.compose.enabled=true
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

management.datadog.metrics.export.enabled=false

spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
spring.mail.properties.mail.debug=true

app.mail.from=no-reply@haulius.com
app.mail.from-name=Haulius

# Frontend base URL used when constructing verification/reset links
app.frontend.base-url=${FRONTEND_BASE_URL}

# Google Maps — used for driving distance calculation
app.google-maps.api-key=${GOOGLE_MAPS_API_KEY:}

# Cookie security — set COOKIE_SECURE=false and COOKIE_SAME_SITE=Lax for local HTTP dev
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# CORS allowed origins — must be set explicitly in prod via ALLOWED_ORIGINS env var
app.cors.allowed-origins=${ALLOWED_ORIGINS}

spring.task.scheduling.enabled=true

# ── HikariCP connection pool ──────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ── Actuator health endpoint ──────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator

# ── Google reCAPTCHA v3 ───────────────────────────────────────────────────────
captcha.secret-key=${CAPTCHA_BACK_KEY}

# ── Anthropic Claude AI ───────────────────────────────────────────────────────
anthropic.api-key=${ANTHROPIC_API_KEY}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-5}
