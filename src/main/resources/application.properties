spring.application.name=loadboard-backend

server.port=8080

spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.mapper.accept-case-insensitive-properties=true

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.defer-datasource-initialization=true

# ── Dev tooling ───────────────────────────────────────────────────────────────
spring.docker.compose.enabled=false
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ── Security ──────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# ── Mail ──────────────────────────────────────────────────────────────────────
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
spring.mail.properties.mail.debug=false

app.mail.from=no-reply@haulius.com
app.mail.from-name=Haulius

# ── URLs ──────────────────────────────────────────────────────────────────────
app.frontend.base-url=${FRONTEND_BASE_URL}
app.cors.allowed-origins=${ALLOWED_ORIGINS}

# ── Cookie (COOKIE_SECURE=false, COOKIE_SAME_SITE=Lax for local dev) ──────────
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# ── Google Maps ───────────────────────────────────────────────────────────────
app.google-maps.api-key=${GOOGLE_MAPS_API_KEY:}

# ── reCAPTCHA (leave CAPTCHA_BACK_KEY unset locally to skip verification) ─────
captcha.secret-key=${CAPTCHA_BACK_KEY:}

# ── Anthropic Claude AI ───────────────────────────────────────────────────────
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-5}

# ── Scheduling ────────────────────────────────────────────────────────────────
spring.task.scheduling.enabled=true

# ── HikariCP connection pool ──────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ── Actuator ──────────────────────────────────────────────────────────────────
management.datadog.metrics.export.enabled=false
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:never}
management.endpoints.web.base-path=/actuator
